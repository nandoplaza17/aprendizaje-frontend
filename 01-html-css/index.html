<!DOCTYPE html>
<!-- Declara que el documento usa el estándar HTML5. -->

<html lang="es">
<!-- lang="es" indica el idioma del contenido.
     Ayuda a lectores de pantalla y a los traductores del navegador. -->

<head>
  <!-- Metadatos: información sobre la página, no visible en ella. -->
  <meta charset="UTF-8">
  <!-- UTF-8 permite usar tildes, ñ y símbolos sin errores. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página se adapte al ancho real del dispositivo móvil. -->

  <title>Mi primera página</title>
  <!-- Texto que aparece en la pestaña del navegador. -->
</head>

<body>
  <!-- Todo lo que se muestra al usuario va dentro de body. -->

  <header>
    <!-- Encabezado de la página. -->
    <h1>Fernando Plaza</h1>
    <p>Estoy aprendiendo desarrollo frontend.</p>
  </header>

  <main>
    <!-- Contenido principal y único de este documento. -->

    <section>
      <h2>Sobre mí</h2>
      <p>
        Este es mi primer documento HTML. Aquí practico la estructura
        semántica antes de empezar con CSS.
      </p>
    </section>

    <section>
      <h2>Lo que quiero aprender</h2>
      <ul>
        <!-- ul crea una lista no ordenada; cada li es un elemento. -->
        <li>HTML semántico</li>
        <li>CSS y diseño adaptable</li>
        <li>JavaScript</li>
        <li>React</li>
      </ul>
    </section>
  </main>

  <footer>
    <!-- Pie de página: información final del documento. -->
    <p>Aprendizaje frontend - 2026</p>
  </footer>

</body>
</html>
